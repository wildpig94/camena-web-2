<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>CAMENA se mudó a camena.com.mx</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://camena.com.mx/">
<meta http-equiv="refresh" content="0; url=https://camena.com.mx/">
<style>
  :root { color-scheme: dark }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#191510; color:#f4efe7; text-align:center; padding:24px;
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.6 }
  .caja { max-width:34rem }
  .marca { color:#d9b44a; font-weight:800; letter-spacing:.14em; font-size:.8rem;
           text-transform:uppercase; margin:0 0 1rem }
  h1 { font-size:1.5rem; margin:0 0 .75rem; font-weight:600 }
  p { margin:0 0 1.5rem; color:#c9c0b4 }
  a.boton { display:inline-block; padding:.85rem 1.6rem; border-radius:999px;
            background:#d9b44a; color:#191510; font-weight:700; text-decoration:none }
  a.boton:focus-visible { outline:3px solid #f4efe7; outline-offset:3px }
</style>
</head>
<body>
  <div class="caja">
    <p class="marca">CAMENA</p>
    <h1>Esta dirección cambió</h1>
    <p>El sitio de CAMENA ahora vive en <strong>camena.com.mx</strong>. Te llevamos allá.</p>
    <p><a class="boton" href="https://camena.com.mx/">Ir a camena.com.mx</a></p>
  </div>
<script>
/* Si alguien llega a una página concreta de la dirección vieja, se le lleva a
   la misma página en el dominio nuevo: se quita el nombre del repositorio del
   principio de la ruta y la extensión .html, que es como se sirve ahora. */
(function () {
  var ruta = location.pathname.replace(/^\\/[^\\/]+\\/?/, '').replace(/\\.html$/, '');
  location.replace('https://camena.com.mx/' + ruta + location.search + location.hash);
})();
</script>
</body>
</html>
