# ═══════════════════════════════════════════════════════════════
# Publicación en GitHub Pages.
#
# El sitio es estático y no tiene paso de compilación: se sube tal cual.
# Este flujo solo lo publica. Antes de hacerlo, comprueba dos cosas que
# romperían la versión en línea y que no se ven en un diff:
#   · que no falte ninguna referencia local (css, js, assets, fuentes)
#   · que el JSON-LD siga siendo JSON válido
#
# Versiones de las acciones: se mantienen en la última versión mayor. Las
# antiguas (checkout v4 y anteriores) corrían sobre Node 20, que GitHub ya
# retiró: seguían funcionando a la fuerza y dejaban un aviso en cada
# publicación. Al subir de versión mayor, conviene volver a publicar y
# comprobar el sitio en línea.
# ═══════════════════════════════════════════════════════════════
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega otro, espera en vez de pisarlo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Comprobar el sitio antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar que existan todos los archivos referenciados
        run: |
          echo "── Referencias locales ──"
          # Cada HTML se revisa contra SU carpeta: así funcionan igual las rutas
          # de la raíz y las de una subcarpeta como producto/ o demo/.
          fallos=0
          for archivo in *.html */[a-z]*.html; do
            [ -e "$archivo" ] || continue
            dir="$(dirname "$archivo")"
            grep -ohE '(src|href)="[^"#][^"]*"' "$archivo" \
              | sed -E 's/.*="([^"]*)".*/\1/' \
              | grep -vE '^(https?:|mailto:|tel:|//|#)' \
              | sort -u > /tmp/refs.txt
            while read -r ref; do
              # Un enlace puede traer fragmento o parámetros: se comprueba el archivo
              limpio="${ref%%#*}"
              limpio="${limpio%%\?*}"
              [ -z "$limpio" ] && continue
              if [ ! -e "$dir/$limpio" ]; then
                echo "  ✗ falta: $dir/$limpio (referenciado como $ref en $archivo)"
                fallos=$((fallos + 1))
              fi
            done < /tmp/refs.txt
          done
          if [ "$fallos" -gt 0 ]; then
            echo "✗ $fallos referencia(s) rota(s). No se publica."
            exit 1
          fi
          echo "✓ Todas las referencias locales existen."

      - name: Verificar el JSON-LD
        run: |
          python3 - <<'PY'
          import json, re, sys, glob
          fallos = 0
          for archivo in glob.glob("*.html"):
              html = open(archivo, encoding="utf-8").read()
              for bloque in re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S):
                  try:
                      json.loads(bloque)
                      print(f"  ✓ {archivo}: JSON-LD válido")
                  except json.JSONDecodeError as e:
                      print(f"  ✗ {archivo}: JSON-LD inválido → {e}")
                      fallos += 1
          sys.exit(1 if fallos else 0)
          PY


      - name: Verificar que el HTML esté completo
        run: |
          # Un corte accidental del HTML deja la página "funcionando" pero
          # mutilada: sin formulario, sin cierres. Esto lo detecta.
          python3 - <<'PY'
          import glob, re, sys
          fallos = 0
          PAres = ["main", "section", "div", "form", "article", "aside", "ul", "ol", "li", "dl", "details", "footer", "header", "nav"]
          for archivo in sorted(glob.glob("*.html")):
              html = open(archivo, encoding="utf-8").read()
              problemas = []
              for etiqueta in PAres:
                  a = len(re.findall(r"<" + etiqueta + r"[\s>]", html))
                  c = len(re.findall(r"</" + etiqueta + r">", html))
                  if a != c:
                      problemas.append(f"{etiqueta}: {a} abiertas / {c} cierres")
              # Cada formulario necesita campos y cierre
              if "<form" in html:
                  if not re.search(r"<input|<textarea|<select", html):
                      problemas.append("hay un <form> sin ningún campo")
                  if "</form>" not in html:
                      problemas.append("hay un <form> sin cerrar")
              if problemas:
                  print(f"  ✗ {archivo}")
                  for p in problemas:
                      print("      " + p)
                  fallos += 1
              else:
                  print(f"  ✓ {archivo}")
          sys.exit(1 if fallos else 0)
          PY

      - name: Verificar que existan las páginas enlazadas
        run: |
          for pagina in index.html servicios.html como-trabajamos.html aviso-de-privacidad.html terminos.html; do
            if [ -f "$pagina" ]; then echo "  ✓ $pagina"; else echo "  ✗ falta $pagina"; exit 1; fi
          done

  publicar:
    name: Publicar
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Preparar solo lo que se publica
        run: |
          # Los archivos de trabajo (docs/, .github/, README, .gitignore) no
          # forman parte del sitio y no tienen por qué quedar accesibles en la
          # web. Se publica únicamente lo que el navegador necesita.
          mkdir -p publicar
          cp -r assets css js producto publicar/
          cp index.html servicios.html como-trabajamos.html aviso-de-privacidad.html terminos.html publicar/
          cp robots.txt sitemap.xml site.webmanifest .nojekyll publicar/

          # El navegador se guarda el CSS y el JS. Sellar la huella del contenido
          # en la URL hace que un cambio de diseño se vea al instante y que, si
          # nada cambió, el caché se siga aprovechando. Se corre sobre la copia
          # publicada: el repo no se toca.
          python3 docs/versionar.py publicar

          # ── Candado: el código de un producto terminado no se publica ──
          # Lo que el navegador muestra, el navegador lo guarda: una página de
          # producto publicada es una página de producto copiable. El expediente
          # del taller vive fuera de este repo (ver README) y no se enlaza ni se
          # publica. Si algún día alguien lo deja caer en producto/, este paso
          # frena la publicación en vez de regalarlo en silencio.
          permitidos="producto/control-de-autos.html"
          sobrantes=""
          for f in $(find publicar/producto -type f 2>/dev/null | sed 's|^publicar/||'); do
            case " $permitidos " in
              *" $f "*) ;;
              *) sobrantes="$sobrantes $f" ;;
            esac
          done
          if [ -n "$sobrantes" ]; then
            echo "✗ Hay archivos de producto que no deben publicarse:$sobrantes"
            echo "  Muévelos fuera del repo (ver «Los dos productos» en el README)"
            echo "  o agrégalos a la lista de permitidos si la decisión cambió."
            exit 1
          fi
          echo "✓ Ningún producto terminado fuera de la lista permitida."

          echo "── Contenido que se publica ──"
          find publicar -type f | sort | sed 's|^|  |'
          echo "  ($(find publicar -type f | wc -l) archivos)"

      - name: Empaquetar el sitio
        # A partir de la v4, este paso NO incluye archivos ocultos en el paquete
        # (el `.nojekyll` de arriba queda fuera). No importa: este flujo publica
        # el artefacto tal cual, sin pasar por Jekyll, que es justo para lo que
        # servía ese archivo.
        uses: actions/upload-pages-artifact@v5
        with:
          path: publicar

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
