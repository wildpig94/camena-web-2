# ═══════════════════════════════════════════════════════════════
# Publicación en Cloudflare Pages.
#
# El sitio es estático y no tiene paso de compilación: se sube tal cual.
# Este flujo lo publica en el proyecto «camena» de Cloudflare Pages, que es
# el que sirve camena.com.mx.
#
# Antes de subir nada corre docs/preparar-publicacion.sh, la misma puerta que
# se usa a mano en este equipo. Es a propósito: una sola lista de lo que se
# publica y un solo juego de comprobaciones, así lo que se revisa aquí es
# exactamente lo que se revisa en la máquina. Ese script:
#   · copia solo las páginas del sitio (nada de docs/, README ni .github)
#   · sella la versión de CSS y JS en las direcciones
#   · frena si se cuela una página que no debe publicarse
#   · frena si queda rastro de la dirección vieja (github.io)
#   · frena si falta un archivo referenciado, si el HTML está cortado o si
#     el JSON-LD dejó de ser JSON válido
#
# Lo que hace falta para que esto funcione (una sola vez):
#   · el secreto CLOUDFLARE_API_TOKEN en el repositorio, con permiso
#     «Account → Cloudflare Pages → Edit»
#   · el secreto CLOUDFLARE_ACCOUNT_ID
#
# Nota sobre las ramas: solo `main` publica al sitio. Cualquier otra rama
# crea una previsualización en una dirección *.pages.dev que no toca
# camena.com.mx. Lo de prueba vive ahí o en el proyecto «camena-laboratorio»,
# nunca en el sitio.
# ═══════════════════════════════════════════════════════════════
name: Publicar en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Una publicación a la vez; si llega otra, espera en vez de pisarla
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Verificar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar y verificar el sitio
        # Este paso es la puerta: si algo no cuadra, no se publica nada.
        run: bash docs/preparar-publicacion.sh /tmp/camena-publicar

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/camena-publicar --project-name=camena --branch=main
