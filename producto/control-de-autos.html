<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Autos</title>
<meta name="description" content="Registro de los autos que entran al taller: aseguradora, siniestro, días en piso y salida. Los datos se guardan en el navegador; no se suben a ningún servidor.">
<meta name="theme-color" content="#1c1f22">
<link rel="icon" href="../assets/favicon.ico">
<style>
  /* Fuentes propias: la página no le pide nada a Google. Cada familia llega en
     un solo archivo variable, así que un @font-face cubre todos los pesos. */
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url(../assets/fonts/ibm-plex-sans-latin.woff2) format('woff2')}
  @font-face{font-family:'Oswald';font-style:normal;font-weight:500 700;font-display:swap;src:url(../assets/fonts/oswald-latin.woff2) format('woff2')}

  :root{
    --bg: #1c1f22;
    --panel: #24282c;
    --panel-light: #2b3035;
    --panel-lighter: #32373d;
    --text: #edeff1;
    --text-dim: #9aa3ab;
    --accent: #ffb020;
    --accent-dark: #cc8c10;
    --green: #4cae6d;
    --red: #e5484d;
    --border: #383d42;
    --font-display: 'Oswald', 'Arial Narrow', Arial, sans-serif;
    --font-body: 'IBM Plex Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  #app{ max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ---------- HEADER ---------- */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
    padding-bottom: 16px; margin-bottom: 18px;
    border-bottom: 3px solid var(--accent);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-badge{
    width:46px; height:46px; border-radius:8px;
    background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 8px, #1c1f22 8px, #1c1f22 16px);
    border: 2px solid var(--accent-dark);
    flex-shrink:0;
  }
  .brand h1{
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: 22px;
    margin:0;
    line-height:1.1;
  }
  .brand span{
    display:block;
    font-family: var(--font-body);
    text-transform:none;
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 0;
    margin-top:2px;
  }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  button{ font-family: var(--font-body); cursor:pointer; }

  .btn{
    border:none; border-radius:8px; padding:10px 16px;
    font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
    transition: transform .05s ease, filter .15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--accent); color:#1c1f22; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background: var(--panel-light); color: var(--text); border:1px solid var(--border); }
  .btn-ghost:hover{ background: var(--panel-lighter); }
  .btn-sm{ padding:7px 11px; font-size:13px; border-radius:7px; }
  .btn-danger-ghost{ background:transparent; color: var(--text-dim); border:1px solid var(--border); }
  .btn-danger-ghost:hover{ color: var(--red); border-color: var(--red); }

  /* ---------- HELP PANEL ---------- */
  .help{
    background: var(--panel); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:8px; padding:14px 16px; margin-bottom:18px; font-size:14px; line-height:1.6; color: var(--text-dim);
  }
  .help b{ color: var(--text); }
  .help ol{ margin:8px 0 0 18px; padding:0; }
  .help-toggle{ font-size:13px; color: var(--accent); background:none; border:none; text-decoration:underline; padding:10px 0; margin-bottom:8px; }

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom: 16px;
  }
  .search-box{
    flex: 1 1 220px; position:relative;
  }
  .search-box input{
    width:100%; padding:10px 12px 10px 34px; border-radius:8px; border:1px solid var(--border);
    background: var(--panel); color:var(--text); font-size:14px;
  }
  .search-box::before{
    content:"⚲"; position:absolute; left:11px; top:50%; transform:translateY(-50%) rotate(90deg);
    color: var(--text-dim); font-size:14px;
  }
  select, .toolbar select{
    padding:10px 10px; border-radius:8px; border:1px solid var(--border);
    background: var(--panel); color: var(--text); font-size:14px;
  }

  /* ---------- TABS ---------- */
  .tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom: 1px solid var(--border); }
  .tab{
    background:none; border:none; color: var(--text-dim); font-family: var(--font-display);
    text-transform:uppercase; letter-spacing:.03em; font-size:14.5px; padding:10px 6px; margin-right:14px;
    border-bottom: 3px solid transparent; font-weight:600;
  }
  .tab.active{ color: var(--text); border-bottom-color: var(--accent); }
  .tab .count{
    display:inline-block; margin-left:6px; background: var(--panel-lighter); color:var(--text);
    font-family: var(--font-body); font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:10px;
  }

  /* ---------- CARDS ---------- */
  .grid{ display:flex; flex-direction:column; gap:12px; }

  .car-card{
    position:relative;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px 16px 16px 20px;
    display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;
  }
  .car-card::before{
    content:""; position:absolute; left:-1px; top:18px; bottom:18px; width:4px; border-radius:2px;
    background: var(--chip-color, var(--accent));
  }
  .car-card.overdue{ border-color: rgba(229,72,77,0.5); }
  .car-card.done{ opacity:0.88; }

  .car-main{ flex: 1 1 260px; min-width:220px; }
  .car-title{ font-family: var(--font-display); font-size:19px; font-weight:600; letter-spacing:.01em; margin-bottom:4px; }
  .car-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:20px;
    background: var(--chip-bg, var(--panel-lighter)); color: var(--chip-color, var(--text));
    border: 1px solid var(--chip-color, var(--border));
  }
  .plate-chip{ background: var(--panel-lighter); color: var(--text-dim); border:1px solid var(--border); font-family: monospace; letter-spacing: 1px; }
  .notes{ margin-top:8px; font-size:13px; color: var(--text-dim); font-style:italic; }

  .car-days{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:78px; text-align:center; padding: 4px 8px;
  }
  .car-days .num{ font-family: var(--font-display); font-size:30px; line-height:1; font-weight:700; }
  .car-days .num.warn{ color: var(--accent); }
  .car-days .num.danger{ color: var(--red); }
  .car-days .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color: var(--text-dim); margin-top:2px; }

  .car-dates{ font-size:12.5px; color:var(--text-dim); margin-top:8px; }
  .car-dates b{ color: var(--text); font-weight:600; }

  .car-actions{ display:flex; flex-direction:column; gap:6px; min-width:120px; }

  .empty-state{
    text-align:center; padding: 50px 20px; color: var(--text-dim); font-size:15px;
  }
  .empty-state b{ color:var(--text); display:block; font-family:var(--font-display); font-size:18px; margin-bottom:6px; text-transform:uppercase;}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:flex-start; justify-content:center;
    padding: 30px 14px; overflow-y:auto; z-index:100;
  }
  .modal{
    background: var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px;
    width:100%; max-width:480px;
  }
  .modal h2{ font-family: var(--font-display); text-transform:uppercase; font-size:19px; margin:0 0 16px; letter-spacing:.02em; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color: var(--text-dim); margin-bottom:5px; font-weight:600; }
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%; padding:10px 11px; border-radius:8px; border:1px solid var(--border);
    background: var(--panel-light); color: var(--text); font-size:14.5px; font-family: var(--font-body);
  }
  .field textarea{ resize:vertical; min-height:50px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .insurer-add-row{ display:flex; gap:6px; }
  .insurer-add-row input{ flex:1; }
  .insurer-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .insurer-list .chip{ cursor:default; }
  .insurer-list .chip button{ background:none; border:none; color:inherit; font-size:13px; margin-left:2px; padding:0; line-height:1; }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background: var(--panel-lighter); border:1px solid var(--border); border-left:4px solid var(--green);
    color: var(--text); padding:12px 16px; border-radius:9px; font-size:14px;
    display:flex; align-items:center; gap:14px; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index:200;
  }
  .toast button{ background:none; border:none; color: var(--accent); font-weight:700; font-size:13.5px; }

  footer{ text-align:center; color: var(--text-dim); font-size:12px; margin-top:34px; }

  footer.app-footer{
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  footer.app-footer .footer-note{ max-width:520px; }

  @media (max-width: 560px){
    .car-card{ flex-direction:column; }
    .car-days{ flex-direction:row; gap:8px; align-items:baseline; }
    .car-actions{ flex-direction:row; width:100%; }
    .car-actions .btn{ flex:1; justify-content:center; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const STORAGE_CARS = 'taller_autos_v1';
  const STORAGE_INSURERS = 'taller_aseguradoras_v1';
  const DEFAULT_INSURERS = ['GNP','Qualitas','AXA','HDI','Mapfre','Chubb','Zurich','ANA'];
  const PALETTE = ['#ffb020','#4cae6d','#5aa9e6','#e5484d','#c084fc','#f472b6','#38bdf8','#f59e0b','#34d399','#fb7185'];

  let cars = [];
  let insurers = [];
  let state = {
    tab: 'activos',
    search: '',
    filterInsurer: '',
    showHelp: false,
    modal: null, // 'add' | 'edit' | 'settings'
    editingId: null,
    lastUndo: null
  };

  function loadData(){
    try{
      const rawCars = localStorage.getItem(STORAGE_CARS);
      cars = rawCars ? JSON.parse(rawCars) : [];
    }catch(e){ cars = []; }
    try{
      const rawIns = localStorage.getItem(STORAGE_INSURERS);
      insurers = rawIns ? JSON.parse(rawIns) : DEFAULT_INSURERS.slice();
    }catch(e){ insurers = DEFAULT_INSURERS.slice(); }
  }
  function saveCars(){ localStorage.setItem(STORAGE_CARS, JSON.stringify(cars)); }
  function saveInsurers(){ localStorage.setItem(STORAGE_INSURERS, JSON.stringify(insurers)); }

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(d){
    if(!d) return '—';
    const [y,m,day] = d.split('-');
    return `${day}/${m}/${y}`;
  }
  function daysBetween(start, end){
    const s = new Date(start+'T00:00:00');
    const e = new Date((end||todayStr())+'T00:00:00');
    return Math.max(0, Math.round((e-s)/86400000));
  }
  function colorFor(name){
    if(!name) return PALETTE[0];
    let hash = 0;
    for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
    return PALETTE[Math.abs(hash) % PALETTE.length];
  }
  function uid(){ return 'c'+Date.now()+Math.random().toString(36).slice(2,7); }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- ACTIONS ----------
  function addOrUpdateCar(data, id){
    if(id){
      const car = cars.find(c=>c.id===id);
      Object.assign(car, data);
    } else {
      cars.push(Object.assign({ id: uid(), estado:'en_taller', fechaSalida:null }, data));
    }
    saveCars();
    closeModal();
    render();
  }

  function markSalida(id){
    const car = cars.find(c=>c.id===id);
    if(!car) return;
    state.lastUndo = { id, prevEstado: car.estado, prevSalida: car.fechaSalida };
    car.estado = 'entregado';
    car.fechaSalida = todayStr();
    saveCars();
    render();
    showToast(`${car.descripcion} marcado como entregado.`, undoLast);
  }

  function undoLast(){
    if(!state.lastUndo) return;
    const car = cars.find(c=>c.id===state.lastUndo.id);
    if(car){
      car.estado = state.lastUndo.prevEstado;
      car.fechaSalida = state.lastUndo.prevSalida;
      saveCars();
    }
    state.lastUndo = null;
    hideToast();
    render();
  }

  function deleteCar(id){
    const car = cars.find(c=>c.id===id);
    if(!car) return;
    if(!confirm(`¿Eliminar el registro de "${car.descripcion}"? Esto no se puede deshacer.`)) return;
    cars = cars.filter(c=>c.id!==id);
    saveCars();
    render();
  }

  function reingresar(id){
    const car = cars.find(c=>c.id===id);
    if(!car) return;
    car.estado = 'en_taller';
    car.fechaSalida = null;
    saveCars();
    render();
  }

  function addInsurer(name){
    name = name.trim();
    if(!name) return;
    if(!insurers.includes(name)) insurers.push(name);
    saveInsurers();
    render();
  }
  function removeInsurer(name){
    insurers = insurers.filter(i=>i!==name);
    saveInsurers();
    render();
  }

  function exportBackup(){
    const payload = { cars, insurers, exportado: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `respaldo-taller-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const data = JSON.parse(e.target.result);
        if(!Array.isArray(data.cars)) throw new Error('formato');
        if(!confirm('Esto reemplazará TODOS los datos actuales con los del respaldo. ¿Continuar?')) return;
        cars = data.cars;
        insurers = Array.isArray(data.insurers) && data.insurers.length ? data.insurers : DEFAULT_INSURERS.slice();
        saveCars(); saveInsurers();
        render();
        alert('Respaldo cargado correctamente.');
      }catch(err){
        alert('No se pudo leer este archivo. Asegúrate de que sea un respaldo generado por esta misma herramienta.');
      }
    };
    reader.readAsText(file);
  }

  // ---------- TOAST ----------
  let toastTimeout = null;
  function showToast(msg, onUndo){
    hideToast();
    const el = document.createElement('div');
    el.className = 'toast';
    el.id = 'toast';
    el.innerHTML = `<span>${escapeHtml(msg)}</span>` + (onUndo ? `<button id="toast-undo">DESHACER</button>` : '');
    document.body.appendChild(el);
    if(onUndo) el.querySelector('#toast-undo').onclick = onUndo;
    toastTimeout = setTimeout(hideToast, 6000);
  }
  function hideToast(){
    const el = document.getElementById('toast');
    if(el) el.remove();
    if(toastTimeout) clearTimeout(toastTimeout);
  }

  // ---------- MODAL ----------
  function openAddModal(){ state.modal='add'; state.editingId=null; render(); }
  function openEditModal(id){ state.modal='edit'; state.editingId=id; render(); }
  function openSettingsModal(){ state.modal='settings'; render(); }
  function closeModal(){ state.modal=null; state.editingId=null; render(); }

  window.appActions = {
    markSalida, deleteCar, reingresar, openEditModal, openAddModal, openSettingsModal, closeModal,
    exportBackup, undoLast
  };

  // ---------- RENDER ----------
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = `
      ${renderHeader()}
      ${state.showHelp ? renderHelp() : `<button class="help-toggle" onclick="window.__toggleHelp()">¿Cómo se usa esto? (ver instrucciones)</button>`}
      ${renderToolbar()}
      ${renderTabs()}
      ${renderList()}
      <footer class="app-footer">
        <div class="footer-note">Los datos se guardan en este navegador / esta computadora. Usa "Respaldo" seguido para no perder información.</div>
      </footer>
      ${state.modal ? renderModal() : ''}
    `;
    wireEvents();
  }

  function renderHeader(){
    return `
    <div class="header">
      <div class="brand">
        <div class="brand-badge"></div>
        <h1>Control de Autos<span>Entradas y salidas del taller</span></h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" onclick="window.appActions.openSettingsModal()">⚙ Aseguradoras / Respaldo</button>
        <button class="btn btn-primary" onclick="window.appActions.openAddModal()">+ Registrar entrada</button>
      </div>
    </div>`;
  }

  function renderHelp(){
    return `
    <div class="help">
      <button class="help-toggle" onclick="window.__toggleHelp()">Ocultar instrucciones</button>
      <div><b>Cómo se usa, en 4 pasos:</b>
      <ol>
        <li>Cuando entra un auto, clic en <b>"+ Registrar entrada"</b> y llena el color, la aseguradora y de qué se trata (choque, pintura, etc). La fecha de hoy se pone sola.</li>
        <li>El auto aparece en la lista de <b>"En el taller"</b>. Ahí ven todos los que faltan por salir, y cuántos días llevan.</li>
        <li>Cuando el auto sale, busca su tarjeta y clic en <b>"Marcar salida"</b>. Se mueve automáticamente al <b>"Historial"</b>.</li>
        <li>De vez en cuando, clic en <b>"⚙ Aseguradoras / Respaldo"</b> y luego <b>"Descargar respaldo"</b> para guardar una copia por si acaso.</li>
      </ol>
      </div>
    </div>`;
  }

  function renderToolbar(){
    return `
    <div class="toolbar">
      <div class="search-box">
        <input type="text" placeholder="Buscar por color, descripción, placa o aseguradora..." value="${escapeHtml(state.search)}" oninput="window.__onSearch(this.value)">
      </div>
      <select onchange="window.__onFilterInsurer(this.value)">
        <option value="">Todas las aseguradoras</option>
        ${insurers.map(i=>`<option value="${escapeHtml(i)}" ${state.filterInsurer===i?'selected':''}>${escapeHtml(i)}</option>`).join('')}
      </select>
    </div>`;
  }

  function renderTabs(){
    const activos = cars.filter(c=>c.estado==='en_taller').length;
    const entregados = cars.filter(c=>c.estado==='entregado').length;
    return `
    <div class="tabs">
      <button class="tab ${state.tab==='activos'?'active':''}" onclick="window.__setTab('activos')">En el taller <span class="count">${activos}</span></button>
      <button class="tab ${state.tab==='historial'?'active':''}" onclick="window.__setTab('historial')">Historial <span class="count">${entregados}</span></button>
    </div>`;
  }

  function applyFilters(list){
    let out = list;
    if(state.filterInsurer){
      out = out.filter(c => c.aseguradora === state.filterInsurer);
    }
    if(state.search.trim()){
      const q = state.search.trim().toLowerCase();
      out = out.filter(c =>
        (c.descripcion||'').toLowerCase().includes(q) ||
        (c.color||'').toLowerCase().includes(q) ||
        (c.placa||'').toLowerCase().includes(q) ||
        (c.aseguradora||'').toLowerCase().includes(q) ||
        (c.folio||'').toLowerCase().includes(q)
      );
    }
    return out;
  }

  function renderList(){
    if(state.tab==='activos'){
      let list = cars.filter(c=>c.estado==='en_taller');
      list = applyFilters(list);
      list.sort((a,b)=> a.fechaEntrada.localeCompare(b.fechaEntrada));
      if(list.length===0){
        return `<div class="empty-state"><b>No hay autos aquí</b>Registra una entrada con el botón de arriba, o ajusta la búsqueda.</div>`;
      }
      return `<div class="grid">${list.map(renderActiveCard).join('')}</div>`;
    } else {
      let list = cars.filter(c=>c.estado==='entregado');
      list = applyFilters(list);
      list.sort((a,b)=> (b.fechaSalida||'').localeCompare(a.fechaSalida||''));
      if(list.length===0){
        return `<div class="empty-state"><b>Historial vacío</b>Aquí aparecerán los autos ya entregados.</div>`;
      }
      return `<div class="grid">${list.map(renderDoneCard).join('')}</div>`;
    }
  }

  function renderActiveCard(c){
    const days = daysBetween(c.fechaEntrada, null);
    const dayClass = days >= 14 ? 'danger' : (days >= 7 ? 'warn' : '');
    const overdueClass = days >= 14 ? 'overdue' : '';
    const col = colorFor(c.aseguradora);
    return `
    <div class="car-card ${overdueClass}" style="--chip-color:${col}">
      <div class="car-main">
        <div class="car-title">${escapeHtml(c.descripcion)}</div>
        <div class="car-meta">
          ${c.color ? `<span class="chip" style="--chip-color:${col}">${escapeHtml(c.color)}</span>` : ''}
          <span class="chip" style="--chip-color:${col}">${escapeHtml(c.aseguradora||'Sin aseguradora')}</span>
          ${c.placa ? `<span class="chip plate-chip">${escapeHtml(c.placa)}</span>` : ''}
          ${c.folio ? `<span class="chip plate-chip">Folio: ${escapeHtml(c.folio)}</span>` : ''}
        </div>
        <div class="car-dates">Entró: <b>${fmtDate(c.fechaEntrada)}</b></div>
        ${c.notas ? `<div class="notes">${escapeHtml(c.notas)}</div>` : ''}
      </div>
      <div class="car-days">
        <div class="num ${dayClass}">${days}</div>
        <div class="lbl">día${days===1?'':'s'} aquí</div>
      </div>
      <div class="car-actions">
        <button class="btn btn-primary btn-sm" onclick="window.appActions.markSalida('${c.id}')">Marcar salida</button>
        <button class="btn btn-ghost btn-sm" onclick="window.appActions.openEditModal('${c.id}')">Editar</button>
        <button class="btn btn-danger-ghost btn-sm" onclick="window.appActions.deleteCar('${c.id}')">Eliminar</button>
      </div>
    </div>`;
  }

  function renderDoneCard(c){
    const days = daysBetween(c.fechaEntrada, c.fechaSalida);
    const col = colorFor(c.aseguradora);
    return `
    <div class="car-card done" style="--chip-color:${col}">
      <div class="car-main">
        <div class="car-title">${escapeHtml(c.descripcion)}</div>
        <div class="car-meta">
          ${c.color ? `<span class="chip" style="--chip-color:${col}">${escapeHtml(c.color)}</span>` : ''}
          <span class="chip" style="--chip-color:${col}">${escapeHtml(c.aseguradora||'Sin aseguradora')}</span>
          ${c.placa ? `<span class="chip plate-chip">${escapeHtml(c.placa)}</span>` : ''}
          ${c.folio ? `<span class="chip plate-chip">Folio: ${escapeHtml(c.folio)}</span>` : ''}
        </div>
        <div class="car-dates">Entró: <b>${fmtDate(c.fechaEntrada)}</b> &nbsp;·&nbsp; Salió: <b>${fmtDate(c.fechaSalida)}</b></div>
        ${c.notas ? `<div class="notes">${escapeHtml(c.notas)}</div>` : ''}
      </div>
      <div class="car-days">
        <div class="num">${days}</div>
        <div class="lbl">día${days===1?'':'s'} en total</div>
      </div>
      <div class="car-actions">
        <button class="btn btn-ghost btn-sm" onclick="window.appActions.reingresar('${c.id}')">Reingresar</button>
        <button class="btn btn-danger-ghost btn-sm" onclick="window.appActions.deleteCar('${c.id}')">Eliminar</button>
      </div>
    </div>`;
  }

  function renderModal(){
    if(state.modal==='settings') return renderSettingsModal();
    const editing = state.modal==='edit';
    const car = editing ? cars.find(c=>c.id===state.editingId) : null;
    return `
    <div class="overlay" onclick="if(event.target===this) window.appActions.closeModal()">
      <div class="modal">
        <h2>${editing ? 'Editar auto' : 'Registrar entrada'}</h2>
        <form id="car-form">
          <div class="field">
            <label>Descripción del auto (marca / modelo)</label>
            <input type="text" name="descripcion" required placeholder="Ej. Nissan Versa" value="${car?escapeHtml(car.descripcion):''}">
          </div>
          <div class="field-row">
            <div class="field">
              <label>Color</label>
              <input type="text" name="color" placeholder="Ej. Gris" value="${car?escapeHtml(car.color||''):''}">
            </div>
            <div class="field">
              <label>Placa (opcional)</label>
              <input type="text" name="placa" placeholder="Ej. ABC-123" value="${car?escapeHtml(car.placa||''):''}">
            </div>
          </div>
          <div class="field">
            <label>Aseguradora</label>
            <select name="aseguradora">
              <option value="">Sin aseguradora / particular</option>
              ${insurers.map(i=>`<option value="${escapeHtml(i)}" ${car&&car.aseguradora===i?'selected':''}>${escapeHtml(i)}</option>`).join('')}
            </select>
          </div>
          <div class="field-row">
            <div class="field">
              <label>Folio / orden (opcional)</label>
              <input type="text" name="folio" value="${car?escapeHtml(car.folio||''):''}">
            </div>
            <div class="field">
              <label>Fecha de entrada</label>
              <input type="date" name="fechaEntrada" required value="${car?car.fechaEntrada:todayStr()}">
            </div>
          </div>
          <div class="field">
            <label>Notas (opcional)</label>
            <textarea name="notas" placeholder="Ej. golpe puerta trasera, esperando refacción...">${car?escapeHtml(car.notas||''):''}</textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="window.appActions.closeModal()">Cancelar</button>
            <button type="submit" class="btn btn-primary">${editing ? 'Guardar cambios' : 'Registrar'}</button>
          </div>
        </form>
      </div>
    </div>`;
  }

  function renderSettingsModal(){
    return `
    <div class="overlay" onclick="if(event.target===this) window.appActions.closeModal()">
      <div class="modal">
        <h2>Aseguradoras y respaldo</h2>
        <div class="field">
          <label>Agregar aseguradora</label>
          <div class="insurer-add-row">
            <input type="text" id="new-insurer" placeholder="Ej. Sura">
            <button type="button" class="btn btn-ghost btn-sm" onclick="window.__addInsurer()">Agregar</button>
          </div>
          <div class="insurer-list">
            ${insurers.map(i=>`<span class="chip" style="--chip-color:${colorFor(i)}">${escapeHtml(i)} <button onclick="window.__removeInsurer('${escapeHtml(i)}')">✕</button></span>`).join('')}
          </div>
        </div>
        <hr style="border-color:var(--border); margin:18px 0;">
        <div class="field">
          <label>Respaldo de datos</label>
          <p style="color:var(--text-dim); font-size:13px; margin:0 0 10px;">Descarga un archivo con toda la información para no perderla, o cárgalo en otra computadora.</p>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="btn btn-primary btn-sm" onclick="window.appActions.exportBackup()">⬇ Descargar respaldo</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('import-file').click()">⬆ Cargar respaldo</button>
            <input type="file" id="import-file" accept="application/json" style="display:none">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="window.appActions.closeModal()">Cerrar</button>
        </div>
      </div>
    </div>`;
  }

  function wireEvents(){
    const form = document.getElementById('car-form');
    if(form){
      form.onsubmit = function(e){
        e.preventDefault();
        const fd = new FormData(form);
        const data = {
          descripcion: fd.get('descripcion').trim(),
          color: fd.get('color').trim(),
          placa: fd.get('placa').trim(),
          aseguradora: fd.get('aseguradora'),
          folio: fd.get('folio').trim(),
          fechaEntrada: fd.get('fechaEntrada'),
          notas: fd.get('notas').trim()
        };
        addOrUpdateCar(data, state.editingId);
      };
    }
    const importInput = document.getElementById('import-file');
    if(importInput){
      importInput.onchange = function(){
        if(this.files && this.files[0]) importBackup(this.files[0]);
      };
    }
  }

  window.__toggleHelp = function(){ state.showHelp = !state.showHelp; render(); };
  window.__onSearch = function(v){ state.search = v; render(); document.querySelector('.search-box input')?.focus(); };
  window.__onFilterInsurer = function(v){ state.filterInsurer = v; render(); };
  window.__setTab = function(t){ state.tab = t; render(); };
  window.__addInsurer = function(){
    const input = document.getElementById('new-insurer');
    addInsurer(input.value);
  };
  window.__removeInsurer = function(name){ removeInsurer(name); };

  loadData();
  render();
})();
</script>
</body>
</html>
